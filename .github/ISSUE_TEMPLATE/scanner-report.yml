name: Scanner report
description: Tell us how Omascan works with your scanner, good or bad.
title: "Scanner: "
labels: ["scanner"]
body:
  - type: markdown
    attributes:
      value: |
        Omascan drives SANE, and SANE talks to the scanner. Before reporting,
        please check that SANE itself can scan:

        ```sh
        scanimage -L
        scanimage -d '<id from the list>' -o test.png
        ```

        If either fails, the problem is in SANE or the scanner's driver
        (for most network scanners, [sane-airscan](https://github.com/alexpevzner/sane-airscan/issues)),
        and is best reported there. Reports of scanners that work are welcome too.
  - type: checkboxes
    id: sane
    attributes:
      label: SANE on its own
      options:
        - label: "`scanimage -L` lists the scanner"
          required: true
        - label: "A scan with `scanimage -d <id> -o test.png` works"
          required: true
  - type: input
    id: model
    attributes:
      label: Scanner model
      placeholder: Brother MFC-J6955DW
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection
      options:
        - Network (Wi-Fi or Ethernet)
        - USB
    validations:
      required: true
  - type: input
    id: driver
    attributes:
      label: SANE driver
      description: The start of the scanner's id in `omascan devices`, such as airscan, escl, epson2 or brother5.
      placeholder: airscan
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Does it work?
      options:
        - Yes, everything I tried works
        - Partly (say what fails below)
        - No, Omascan doesn't list it
        - No, it is listed but scanning fails
    validations:
      required: true
  - type: checkboxes
    id: tried
    attributes:
      label: What did you try?
      options:
        - label: Flatbed
        - label: Document feeder
        - label: Duplex feeder
        - label: Color, gray and black & white
  - type: textarea
    id: devices
    attributes:
      label: Output of `omascan devices`
      render: text
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Errors shown, odd pages, what you had to install, Omascan version (`pacman -Q omascan`).
